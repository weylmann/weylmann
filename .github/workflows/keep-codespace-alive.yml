name: Keep Codespace Alive

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  ping-codespace:
    runs-on: ubuntu-latest
    steps:
      - name: Start Codespace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting to start Codespace at $(date)"
          
          # List all codespaces to verify access
          echo "Listing codespaces..."
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/user/codespaces | jq -r '.codespaces[]?.name // "No codespaces found"'
          
          # Try to start the specific codespace
          echo "Starting symmetrical-space-eureka-4qv9vjp6qq7h7pr9..."
          RESPONSE=$(curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/user/codespaces/symmetrical-space-eureka-4qv9vjp6qq7h7pr9/start)
          
          echo "Response: $RESPONSE"
          
          # Check if successful
          if echo "$RESPONSE" | jq -e '.state' > /dev/null 2>&1; then
            echo "鉁?Codespace state: $(echo "$RESPONSE" | jq -r '.state')"
          else
            echo "鈿狅笍  May already be running or error occurred"
          fi
          
          echo "Completed at $(date)"
