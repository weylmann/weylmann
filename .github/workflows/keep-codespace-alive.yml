name: Keep Codespace Alive

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  ping-codespace:
    runs-on: ubuntu-latest
    steps:
      - name: Start Codespace
        env:
          PAT: ${{ secrets.CODESPACE_PAT }}
        run: |
          echo "Attempting to start Codespace at $(date)"
          
          # Get current status
          STATUS=$(curl -s -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/user/codespaces/symmetrical-space-eureka-4qv9vjp6qq7h7pr9 | \
            jq -r '.state // "unknown"')
          
          echo "Current status: $STATUS"
          
          # Start if not running
          if [ "$STATUS" = "Shutdown" ] || [ "$STATUS" = "null" ] || [ "$STATUS" = "unknown" ]; then
            echo "Starting Codespace..."
            curl -s -X POST -H "Authorization: Bearer $PAT" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/user/codespaces/symmetrical-space-eureka-4qv9vjp6qq7h7pr9/start | \
              jq -r '{name: .name, state: .state}'
            echo "鉁?Start command sent"
          else
            echo "鉁?Codespace is already running: $STATUS"
          fi
          
          echo "Completed at $(date)"
