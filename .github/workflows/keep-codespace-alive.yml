name: Keep Codespace Alive

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  ping-codespace:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Codespace via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Pinging Codespace at $(date)"
          
          # Get Codespace status
          STATUS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/user/codespaces/symmetrical-space-eureka-4qv9vjp6qq7h7pr9 | \
            jq -r '.state')
          
          echo "Current status: $STATUS"
          
          # If Shutdown, start it
          if [ "$STATUS" = "Shutdown" ]; then
            echo "Starting Codespace..."
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              https://api.github.com/user/codespaces/symmetrical-space-eureka-4qv9vjp6qq7h7pr9/start | \
              jq -r '{name: .name, state: .state}'
          fi
          
          echo "Ping completed at $(date)"
