name: Keep Codespace Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # 姣?5 鍒嗛挓
  workflow_dispatch:

jobs:
  ping-codespace:
    runs-on: ubuntu-latest
    steps:
      - name: Start Codespace
        env:
          PAT: ${{ secrets.CODESPACE_PAT }}
        run: |
          echo "Checking Codespace at $(date)"
          
          # 灏濊瘯鍚姩锛堟棤璁哄綋鍓嶇姸鎬侊級
          curl -s -X POST -H "Authorization: Bearer $PAT" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/user/codespaces/symmetrical-space-eureka-4qv9vjp6qq7h7pr9/start | \
            jq -r '{name: .name, state: .state}'
          
          echo "Completed at $(date)"
